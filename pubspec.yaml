name: brick
description: >
  Flutter Brick is a lightweight scaffold kit.
  Built-in multi-state page, ViewModel, Rx reactive, unified Result & exception mapper,
  Retrofit network wrapper, Repository + local source data layer.
  Suitable for admin / dashboard backend projects.
publish_to: https://github.com
version: 0.0.1

homepage: https://github.com/291700351
repository: https://github.com/291700351/brick
issue_tracker: https://github.com/291700351/brick/issues

environment:
  sdk: ^3.13.7
  flutter: ">=3.24.0"

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
